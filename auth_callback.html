<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cont confirmat — Chibzo</title>
<style>
  :root {
    --accent: #6C5CE7;
    --accent-light: #EDE9FF;
    --text: #1A1A2E;
    --text-secondary: #666666;
    --bg: #F8F7FC;
    --card: #FFFFFF;
    --border: #F0EEFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .card {
    max-width: 420px;
    width: 100%;
    margin: 24px;
    padding: 40px 28px;
    text-align: center;
  }
  .logo {
    width: 64px; height: 64px;
    margin: 0 auto 24px;
    border-radius: 16px;
    background: linear-gradient(135deg, #4834D4, #6C5CE7);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 800; font-size: 28px;
  }
  .check {
    width: 48px; height: 48px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #E8F8F0;
    display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 22px; font-weight: 800; margin: 0 0 10px; }
  p { font-size: 15px; color: var(--text-secondary); line-height: 1.6; margin: 0 0 28px; }
  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    background: linear-gradient(90deg, #6C5CE7, #A29BFE);
    color: white;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    margin-bottom: 12px;
  }
  .hint {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .desktop-only { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">C</div>
  <div class="check">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M5 13l4 4L19 7" stroke="#27AE60" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>Email confirmat!</h1>
  <p id="mainText">Se deschide aplicația Chibzo...</p>

  <a class="btn" id="openBtn" href="io.chibzo.app://login-callback">Deschide Chibzo</a>

  <div class="hint desktop-only" id="desktopHint">
    Se pare că ești pe calculator. Deschide acest email direct de pe telefon
    ca să confirmi contul în aplicație.
  </div>
</div>

<script>
  // Detectăm dacă probabil suntem pe mobil (Android/iOS)
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  if (isMobile) {
    // Încercăm redirect automat către aplicație
    window.location.href = 'io.chibzo.app://login-callback';
  } else {
    // Pe desktop, ascundem butonul (nu are efect) și arătăm mesajul explicativ
    document.getElementById('mainText').textContent =
      'Contul tău a fost confirmat cu succes.';
    document.getElementById('openBtn').style.display = 'none';
    document.getElementById('desktopHint').style.display = 'block';
  }
</script>

</body>
</html>
